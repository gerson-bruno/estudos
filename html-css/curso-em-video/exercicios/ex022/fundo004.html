<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento vertical</title>
    <style>
        #container{
            position: relative;
            height: 94vh;
            padding: 10px;
            background-color: purple;
        }

        #conteudo{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 200px;
            width: 400px;
            background-color: yellow;
        }

    /* Para centralizar horizontalmente o container precisa ser definido como position: relative, ja o conteudo precisa ser definido como position: absolute. A partir disso, inserimos transform: translate(-50%, -50%) e top/left de 50% para centralizar*/
    
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>



</body>
</html>
