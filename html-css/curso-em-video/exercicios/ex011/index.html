<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens Dinâmicas</title>
</head>
<body>

    <h1>Imagens Dinâmicas</h1>
    <p>Tente abrir este site em vários dispositivos para ver como as imagens se adaptam.  </p>

<picture>
    <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
    <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
<img src="imagens/foto-g.png" alt="Imagem flexivel">

<!-- a tag source define as condições para cada imagem ser carregada, o source da imagem menor é sempre acima   SOURCE:MEDIA:SIZES-->


</picture>
    
</body>
</html>
