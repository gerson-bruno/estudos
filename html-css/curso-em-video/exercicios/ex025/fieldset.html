<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário de Cadastro</title>
</head>

<body>
<div class="wrapper">
    <div class="img"></div>
        <main class="container">
        <fieldset>
            <legend>Exemplo de FIELDSET</legend>
        <h1>Formulário de Cadastro</h1>
        <form action="" method="post" autocomplete="on">
            <div class="field">
                <label for="username">Nome</label>
                <input type="text" name="name" id="username" required minlength="6" maxlength="12" placeholder="Digite seu nome">
            </div>
            <div class="field">
                <label for="date">Data de Nascimento</label>
                <input type="date" name="date" id="date" required>
            </div>
            <div class="field">
                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" required placeholder="Digite seu email">
            </div>
            <div class="field">
                <label for="password">Senha</label>
                <input type="password" name="password" id="password" required minlength="8" maxlength="12" placeholder="Digite sua senha">
            </div>
            <button type="submit">Enviar</button>
        </form>
        </fieldset>
        </main>
</div>

</body>
</html>
