<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon_io/favicon.ico" type="image/x-icon">
    <title>Favicon</title>
</head>
<body>
    <h1>Olha o Favicon, como funciona na prática!</h1>

    <img src="favicon_io/android-chrome-192x192.png" alt="Imagem do Favicon">
