<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venda seu carro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="container">
    <header class="header">
        <h3>Venda seu carro</h3>
    </header>

    <section class="form-container">
        <div class="form-header">
            <p>Formulário</p>
        </div>
    

    <section class="form-body">
        <h1 class="form-title">Venda fácil seu carro!</h1></h1>
        <p>Escreva as caracteristicas e marque os opcionais que ele possui</p>
    

    <form>
        <div class="box-input">
        <label for="title">Título do Anúncio <span class="required-field">*</span></label>
        <input type="text" name="title" id="title" class="block" placeholder="Digite o título do anúncio" maxlength="30" required>
        </div>

        <div class="box-input">
        <label for="preco">Preço <span class="required-field">*</span></label>
        <input type="number" name="preco" id="preco" class="block" placeholder="Digite o preço." maxlength="30" required>
        </div>

        <div class="box-input">
        <label for="description">Descrição:<span class="required-field">*</span></label>
        <textarea name="description" id="description" class="block" placeholder="Digite a descrição do carro"></textarea>
        </div>

        <div class="box-input">
        <label for="brand">Marca do Carro <span class="required-field">*</span></label>
        <input type="text" name="brand" id="brand" class="block" placeholder="Qual a marca do carro?" maxlength="30" required>
        </div>

        <div class="box-input">
        <label for="model">Modelo do Carro <span class="required-field">*</span></label>
        <input type="text" name="model" id="model" class="block" placeholder="Qual o modelo do carro?" maxlength="30" required>
        </div>

        <div class="box-input">
        <label for="milage">Kilometragem:<span class="required-field">*</span></label>
        <input type="number" name="milage" id="milage" class="block" placeholder="Qual a kilometragem do carro?" maxlength="30" required>
        </div>

        <div class="box-input">
        <label for="purchase_date">Qual a data da compra:<span class="required-field">*</span></label>
        <input type="date" name="purchase_date" id="purchase_date" class="block" required>
        </div>

        <div class="box-input">
        <p>Tipo de câmbio: <span class="required-field">*</span></p>
        <input type="radio" name="gear" id="manual">
        <label for="manual">Manual</label>
        <input type="radio" name="gear" id="automatic">
        <label for="automatic">Automatico</label>
        </div>

        <div class="optional-box">
        <p>Opções:</p>
        <ul class="optional-list">
            <li><input type="checkbox" name="airbag" id="airbag"> <label for="airbag">Airbag</label></li>
            <li><input type="checkbox" name="alarm" id="alarm"> <label for="alarm">Alarme</label></li>
            <li><input type="checkbox" name="ac" id="ac"> <label for="ac">Ar condicionado</label></li>
        </ul>
        </div>
        <div class="box-input">
            <p>Fotos do carro:</p><input type="file" name="images" id="images" multiple accept="image/png, image/jpg"></div>
    
    <input type="submit" value="Enviar" class="btn-submit">
    </form>
    </section>
</section>
</main>
    
</body>
</html>
