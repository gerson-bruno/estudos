<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        body{
            background-color: rgb(154, 105, 69);
            color: rgb(255, 255, 255);
            font: normal 20pt arial;
        }
    </style>
</head>
<body>
    <h1>Olá mundo do JavaScript!</h1>
    <p>Aprendendo JavaScript</p>

    <script>
        var nome = window.prompt('Qual seu nome?')
        window.alert(`É um prazer te conhecer, ${nome}!`)
        var idade = window.prompt('Qual a sua idade?')
        window.alert(`Que bacana, você tem ${idade} anos!`)   

    </script>
    
</body>
</html>
