<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        body{
            background-color: rgb(154, 105, 69);
            color: rgb(255, 255, 255);
            font: normal 20pt arial;
        }
    </style>
</head>
<body>
    <h1>Olá mundo do JavaScript!</h1>
    <p>Aprendendo JavaScript</p>

    <script>
    window.alert('Olá MUNDO! Seja bem vindo ao meu site!')
    var nome = window.prompt('Qual o seu nome?')
    window.alert(`Seja bem vindo ${nome}!`)
    
    var idade = window.prompt('Qual a sua idade?')
    window.alert(`Que Bacana ${nome}, você tem ${idade} anos!`)

    var cep = window.prompt('Você é de onde?')
    window.alert(`Ah entendi ${nome}, você é de ${cep}, parece ser um ótimo lugar para se viver!`)


    </script>
    
</body>
</html>
