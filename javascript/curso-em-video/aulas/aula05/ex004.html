<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        body{
            background-color: rgb(154, 105, 69);
            color: rgb(255, 255, 255);
            font: normal 20pt arial;
        }
    </style>
</head>
<body>
    <h1>Olá mundo do JavaScript!</h1>
    <p>Aprendendo JavaScript</p>

    <script>
        
        var nome = window.prompt('Qual o seu nome?')
        document.write(`Ola, ${nome}! Seu nome tem ${nome.length} letras.<br>`)
        document.write(`Seu nome em maiúsculas fica ${nome.toUpperCase()}<br>`)
        document.write(`Seu nome em minúsculas fica ${nome.toLowerCase()}`)
        

    </script>
    
</body>
</html>
