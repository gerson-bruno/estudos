<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VestibuTrain</title>
<link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <img src="img/logo-nobg.png" alt="logo vestibutrain" class="logo">
        <h1><span class="title-1">Vestibu</span><span class="title-2">Train</span></h1>
        <p>Reabilitação visual de alta precisão.</p>

        <ul class="exercise-list">
            <li onclick="selectExercise(event,'saccade')">Sacadas <small>(Saccades)</small><span class="icon" onclick="showInfo(event,'saccade')"><i class="fa-solid fa-circle-info"></i></span></li>
            <li onclick="selectExercise(event,'smooth')">Seguimento Suave<span class="icon" onclick="showInfo(event,'smooth')"><i class="fa-solid fa-circle-info"></i></span></li>
            <li onclick="selectExercise(event,'vertical')">Vertical<span class="icon" onclick="showInfo(event,'vertical')"><i class="fa-solid fa-circle-info"></i></span></li>
            <li onclick="selectExercise(event,'diagonal')">Diagonal<span class="icon" onclick="showInfo(event,'diagonal')"><i class="fa-solid fa-circle-info"></i></span></li>
            <li onclick="selectExercise(event,'vor')">VOR x1<span class="icon" onclick="showInfo(event,'vor')"><i class="fa-solid fa-circle-info"></i></span></li>
            <li onclick="selectExercise(event,'optokinetic')">Optocinético<span class="icon" onclick="showInfo(event,'optokinetic')"><i class="fa-solid fa-circle-info"></i></span></li>
            <li onclick="selectExercise(event,'random')">Alvo Aleatório<span class="icon" onclick="showInfo(event,'random')"><i class="fa-solid fa-circle-info"></i></span></li>
        </ul>
    </aside>

    <!-- MAIN -->
    <main class="main">

        <div id="exercise-area" onclick="hitTarget()">
            <div id="optokinetic"></div>
            <div id="ball"></div>
        </div>

        <div class="controls">

            <select id="speed">
                <option value="2">Lento</option>
                <option value="5">Médio</option>
                <option value="10">Rápido</option>
            </select>

            <select id="time">
                <option value="30">30s</option>
                <option value="60">1 min</option>
                <option value="120">2 min</option>
            </select>

            
            <section class="buttons">
            <button onclick="start()"><i class="fa-solid fa-play"></i> Iniciar</button>
            <button onclick="stop()"><i class="fa-solid fa-stop"></i> Parar</button>
            <button onclick="fullscreen()"><i class="fa-solid fa-expand"></i> Tela Cheia </button>
            </section>

            <span id="timer">Tempo: 0 </span><span> <i class="fa-solid fa-stopwatch"></i></span>
            <div id="score"></div>
        </div>
    </main>

</div>

<div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content" id="modal-text"></div>
</div>

<script src="script.js"></script>

</body>
</html>
