<body>

<h1>Reabilitação Visual</h1>

<ul class="exercise-list">
<li onclick="selectExercise('saccade')">Sacadas <small>(Saccades)</small><span class="icon" onclick="showInfo(event,'saccade')">❓</span></li>
<li onclick="selectExercise('smooth')">Seguimento Suave <small>(Smooth)</small><span class="icon" onclick="showInfo(event,'smooth')">❓</span></li>
<li onclick="selectExercise('vertical')">Vertical<span class="icon" onclick="showInfo(event,'vertical')">❓</span></li>
<li onclick="selectExercise('diagonal')">Diagonal<span class="icon" onclick="showInfo(event,'diagonal')">❓</span></li>
<li onclick="selectExercise('vor')">VOR x1<span class="icon" onclick="showInfo(event,'vor')">❓</span></li>
<li onclick="selectExercise('optokinetic')">Optocinético<span class="icon" onclick="showInfo(event,'optokinetic')">❓</span></li>
<li onclick="selectExercise('random')">Alvo Aleatório<span class="icon" onclick="showInfo(event,'random')">❓</span></li>
</ul>

<div id="exercise-area" onclick="hitTarget()">
<div id="optokinetic"></div>
<div id="ball"></div>
</div>

<div class="controls">

<select id="speed">
<option value="2">Lento</option>
<option value="5">Médio</option>
<option value="10">Rápido</option>
</select>

<select id="time">
<option value="30">30s</option>
<option value="60">1 min</option>
<option value="120">2 min</option>
</select>

<br>

<button onclick="start()">Iniciar</button>
<button onclick="stop()">Parar</button>
<button onclick="fullscreen()">Tela Cheia</button>

<div id="timer">Tempo: 0</div>
<div id="score"></div>

</div>

<div id="modal" class="modal" onclick="closeModal()">
<div class="modal-content" id="modal-text"></div>
</div>

<script src="script.js"></script>
</body>
</html>
