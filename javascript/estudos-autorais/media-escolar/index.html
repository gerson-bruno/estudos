<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main">
        <section class="container">
            <h1>Média Escolar:</h1>
            <p>📚 Digite suas notas:</p>
            <input type="number" class="input" id="inputnum1" placeholder="Digite sua primeira nota">
            <input type="number" class="input" id="inputnum2" placeholder="Digite sua segunda nota">
            <input type="number" class="input" id="inputnum3" placeholder="Digite sua terceira nota">
            <button id="btn" class="btn">Calcular</button>
            <p id="result" class="result"></p>
            <p id="valorMedia" class="result"></p>  
        </section>  
         <aside class="livros"> 
            <img src="img/media.png" alt="Livros" class="img">
        </aside>   
    </main>
   
<script src="script.js"></script>
</body>
</html>
