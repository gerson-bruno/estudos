<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Flex</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer> </script>
</head>
<body>
    <section id="container">
    <h1>Calculadora Flex</h1>
    <img src="img/neutro.png" alt="Calculadora Flex Neutro" id="img">
    <form id="form">
        <input type="number" id="txtEtanol" placeholder="Etanol">
        <input type="number" id="txtGasolina" placeholder="Gasolina">
        <button type="submit" id="btnCalcular">Calcular</button>
        <button type="reset" id="btnLimpar">Limpar</button>
    </form>
    </section> 

    
</body>
</html>
