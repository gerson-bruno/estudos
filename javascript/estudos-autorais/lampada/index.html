<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lâmpada Inteligente</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>Lâmpada Inteligente</h1>
      <div class="instrutions">
        <p>Pressione o botão para On para ligar,</p>
        <p>Off para desligar ou</p>
        <p>Reset para reiniciar a lâmpada.</p>
      </div>
      <div class="lamp">
        <i class="fa-regular fa-lightbulb initial"></i>
      </div>
      <div>
        <button class="btn-on">On</button>
        <button class="btn-off">Off</button>
      </div>
      <button class="btn-reset">
        <i class="fa-solid fa-arrow-rotate-left"></i>
      </button>
    </main>
  </body>
</html>
