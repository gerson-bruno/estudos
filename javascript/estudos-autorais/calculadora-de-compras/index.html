<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Compras</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <section class="title">
      <h1>Lista de Compras</h1>
      <h2>Adicione os itens da sua lista</h2>
    </section>
    <section class="container">
      <div class="inputs">
        <label for="nome">Item: </label>
        <input type="text" name="nome" id="nome" required />
        <label for="quantidade">Quantidade: </label>
        <input
          type="number"
          name="quantidade"
          id="quantidade"
          value="1"
          required
        />
        <label for="preco">Preço: </label>
        <input type="number" name="preco" id="preco" required />
        <div class="requerid"></div>
      </div>
      <div class="btns">
        <button id="botao-add" class="btn">Adicionar</button>
        <button id="botao-limpar" class="btn-limpar">Limpar Lista</button>
      </div>
    </section>
    <ul id="lista" class="lista"></ul>
    <div id="total-container" class="container">
      <h3>Total da Compra: <span class="preco-total">R$ <span id="valor-total-geral">0.00</span></span></h3>
    </div>
  </body>
</html>
