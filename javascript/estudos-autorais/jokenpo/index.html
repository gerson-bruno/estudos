<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jokenpô Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Jokenpô Pro</h1>

        <div class="placar">
            <span>Você: <span id="userScore">0</span></span>
            <span>CPU: <span id="cpuScore">0</span></span>
        </div>

        <div id="animacao" class="animacao">🤜🤛</div>

        <div id="resultado" class="resultado">Escolha uma opção!</div>

        <div class="botoes">
            <button onclick="jogar('pedra')">🪨 Pedra</button>
            <button onclick="jogar('papel')">📄 Papel</button>
            <button onclick="jogar('tesoura')">✂️ Tesoura</button>
        </div>

        <button class="reset" onclick="resetar()">Reiniciar Placar</button>
    </div>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script src="script.js"></script>
    
</body>
</html>
